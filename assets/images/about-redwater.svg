<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="title desc">
  <title id="title">RedWater Haunted Homestead sign</title>
  <desc id="desc">A circular RedWater Haunted Homestead sign with a sunset, trees, and water reflection.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efe4d8"/>
      <stop offset="28%" stop-color="#f8b26a"/>
      <stop offset="52%" stop-color="#f36d2a"/>
      <stop offset="72%" stop-color="#c61111"/>
      <stop offset="100%" stop-color="#3d0909"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8f0309" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#220305" stop-opacity=".95"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <circle cx="250" cy="250" r="240" fill="#435655"/>
    <circle cx="250" cy="250" r="230" fill="url(#sky)"/>
  </g>

  <path d="M24 292c61-22 123-37 226-37s165 17 226 37v157H24z" fill="url(#water)"/>
  <circle cx="250" cy="226" r="58" fill="#ffe5a2" opacity=".95"/>
  <ellipse cx="250" cy="287" rx="44" ry="68" fill="#fff1d0" opacity=".26"/>

  <g fill="#101010">
    <rect x="56" y="202" width="388" height="20" opacity=".92"/>
    <rect x="56" y="250" width="388" height="12" opacity=".88"/>
    <rect x="56" y="272" width="388" height="8" opacity=".75"/>
  </g>

  <g fill="#111">
    <path d="M94 214l16-33 16 33h-10l8 16h-10l8 17h-24l8-17H96l8-16z"/>
    <rect x="108" y="214" width="4" height="74"/>
    <path d="M390 214l16-33 16 33h-10l8 16h-10l8 17h-24l8-17h-10l8-16z"/>
    <rect x="404" y="214" width="4" height="74"/>
    <path d="M227 242l23-48 23 48h-13l12 24h-13l13 25h-44l13-25h-13l12-24z"/>
    <rect x="248" y="242" width="4" height="120"/>
    <path d="M154 248l10-22 10 22h-6l6 12h-20l6-12z"/>
    <rect x="163" y="248" width="3" height="60"/>
    <path d="M330 248l10-22 10 22h-6l6 12h-20l6-12z"/>
    <rect x="339" y="248" width="3" height="60"/>
  </g>

  <g fill="#111" opacity=".38">
    <path d="M227 306l23 48 23-48h-13l12-24h-13l13-25h-44l13 25h-13l12 24z"/>
    <rect x="248" y="306" width="4" height="96"/>
    <path d="M94 286l16 33 16-33h-10l8-16h-10l8-17h-24l8 17H96l8 16z"/>
    <rect x="108" y="286" width="4" height="62"/>
    <path d="M390 286l16 33 16-33h-10l8-16h-10l8-17h-24l8 17h-10l8 16z"/>
    <rect x="404" y="286" width="4" height="62"/>
  </g>

  <g fill="none" stroke="#6f7675" stroke-width="4">
    <circle cx="250" cy="250" r="242"/>
    <circle cx="250" cy="250" r="230"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle" fill="#b20f20" stroke="#250505" stroke-width="5" paint-order="stroke">
    <text x="250" y="84" font-size="54" letter-spacing="5">REDWATER</text>
    <text x="250" y="430" font-size="38" letter-spacing="3">HAUNTED HOMESTEAD</text>
  </g>
