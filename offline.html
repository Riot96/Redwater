<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>RedWater Offline</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080808;
      --card: #111111;
      --border: rgba(67, 214, 251, 0.2);
      --red: #940405;
      --blue: #43D6FB;
      --text: #e8e8e8;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: radial-gradient(circle at top, rgba(148, 4, 5, 0.25), transparent 32%), var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }
    .offline-card {
      max-width: 30rem;
      padding: 2rem;
      border: 1px solid var(--border);
      border-radius: 1rem;
      background: var(--card);
      text-align: center;
      box-shadow: 0 1.5rem 3rem rgba(0, 0, 0, 0.35);
    }
    .offline-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.75rem;
    }
    p {
      margin: 0 0 1rem;
      color: var(--muted);
      line-height: 1.6;
    }
    strong {
      color: var(--blue);
    }
  </style>
</head>
<body>
  <main class="offline-card">
    <div class="offline-icon" aria-hidden="true">📶</div>
    <h1>You’re offline</h1>
    <p>RedWater can still hold queued uploads on this device.</p>
    <p>Reconnect to the internet and reopen the app to <strong>automatically send any queued photos or videos</strong>.</p>
  </main>
</body>
</html>
